# The #PINILLASYNC server block in /etc/nginx/conf.d/http.conf.
server {
    listen 443 ssl;
    server_name sync.pinillaweb.org;
    ssl_certificate /etc/letsencrypt/live/abs.pinillaweb.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abs.pinillaweb.org/privkey.pem;
    include snippets/hsts.conf;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Keep idle sync connections open; browsers ping every 10 seconds.
        proxy_read_timeout 1h;
    }
}
